<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Election Precinct Results — Utah & Wyoming</title>
<meta name="description" content="Precinct-level election results for Utah and Wyoming.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin>
<style>
  :root {
    --ink: #0f172a; --ink-2: #1e293b; --ink-3: #334155;
    --red: #dc2626; --red-dark: #b91c1c; --red-soft: #fef2f2;
    --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --rep: #dc2626; --dem: #2563eb; --other: #a3a3a3;
    --shadow: 0 10px 30px rgba(15,23,42,.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; font-family: Inter, system-ui, sans-serif; color: var(--text); }
  #map { position: absolute; inset: 0; background: #e5e7eb; }
  button { font: inherit; cursor: pointer; }

  /* ---------- Brand + search ---------- */
  #top { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 1000; display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, 640px) minmax(74px, 1fr); gap: 10px; align-items: start; pointer-events: none; }
  .brand { justify-self: start; }
  #top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px 0 10px; background: var(--ink); border-radius: 14px; box-shadow: var(--shadow); color: white; white-space: nowrap; }
  .brand .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--red); display: grid; place-items: center; }
  .brand b { font-size: 15px; }
  #searchCol { min-width: 0; position: relative; }
  #ask { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 6px; background: var(--ink); border-radius: 14px; box-shadow: var(--shadow); }
  #ask .spark { color: #f87171; flex: none; margin-left: 4px; }
  #askInput { flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: white; font: inherit; font-size: 14px; }
  #askInput::placeholder { color: #94a3b8; }
  .btn-red { height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--red); color: white; font-size: 14px; font-weight: 700; flex: none; }
  .btn-red:hover { background: var(--red-dark); }

  #result { display: none; margin-top: 8px; padding: 10px 10px 10px 14px; background: white; border-radius: 12px; box-shadow: var(--shadow); font-size: 13px; align-items: center; gap: 10px; }
  #result.show { display: flex; }
  #result .txt { flex: 1; line-height: 1.45; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tag { background: var(--red-soft); color: var(--red-dark); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .btn-ghost { height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; }
  .btn-ghost:hover { background: #f1f5f9; color: var(--text); }

  #menuBtn { display: none; }
  /* State outlines: same look as Statewide totals; icon greys out when outlines are off */
  #rStates, #rStates.on { background: var(--ink-2); color: #f87171 !important; }
  #rStates:hover { background: var(--ink-3); }
  #rBase[aria-expanded="true"] { background: var(--red); color: white !important; }
  #rBase[aria-expanded="true"] .tip { color: white; }
  #rStates:not(.on) { color: #64748b !important; }

  /* ---------- Layer rail ---------- */
  #rail { position: absolute; top: 16px; right: 16px; z-index: 1001; display: flex; flex-direction: column; gap: 6px; padding: 6px; background: var(--ink); border-radius: 14px; box-shadow: var(--shadow); }
  .rb { width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--ink-2); display: grid; place-items: center; position: relative; }
  .rb:hover { background: var(--ink-3); }
  .rb.on { background: var(--c, var(--red)); color: white !important; }
  .rb .tip { display: none; position: absolute; right: 54px; top: 50%; transform: translateY(-50%); background: var(--ink); color: white; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none; }
  @media (hover: hover) { .rb:hover .tip { display: block; } }
  #basePanel, #racePanel { display: none; position: absolute; top: 16px; right: 80px; z-index: 1001; width: 210px; background: white; border-radius: 14px; box-shadow: var(--shadow); padding: 12px; flex-direction: column; gap: 6px; }
  #basePanel.open, #racePanel.open { display: flex; }
  #basePanel > *, #racePanel > * { flex: none; }
  #racePanel { width: 268px; top: 66px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 14px; gap: 6px; border: 1px solid #fecaca; border-top: 5px solid var(--red); }
  #racePanel h5 { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; font-size: 11px; font-weight: 700; color: var(--red-dark); text-transform: uppercase; letter-spacing: .06em; }
  #racePanel h5 .hIc { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--red); color: white; }
  .raceGroup { display: flex; align-items: center; gap: 8px; margin: 8px 2px 2px; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #94a3b8; }
  .raceGroup::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .raceOpt { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 12px 8px 8px; border: 1px solid var(--line); border-radius: 12px;
    background: white; color: var(--text); font-size: 14px; font-weight: 600; text-align: left; transition: background .15s, border-color .15s; }
  .raceOpt:hover { background: #f8fafc; border-color: #cbd5e1; }
  .raceOpt .rIc { width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--red); color: white; box-shadow: 0 2px 6px rgba(220,38,38,.3); }
  .raceOpt.on .rIc { background: var(--red-dark); }
  .raceOpt .rTx { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .raceOpt small { font-size: 11px; font-weight: 500; color: var(--muted); line-height: 1.35; }
  .raceOpt.on { border: 2px solid var(--red); padding: 7px 11px 7px 7px; background: var(--red-soft); color: #7f1d1d; }
  .raceOpt.on small { color: #991b1b; }
  .raceOpt.on::after { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px rgba(220,38,38,.15); }
  #raceOff { display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; margin-top: 4px; border: 1px dashed #cbd5e1; border-radius: 12px;
    background: white; color: var(--muted); font-size: 13px; font-weight: 600; }
  #raceOff:hover { color: var(--red-dark); border-color: var(--red); background: var(--red-soft); }
  .raceNote { display: flex; gap: 8px; margin: 6px 2px 0; padding: 10px; border-radius: 10px; background: #f8fafc; font-size: 11px; line-height: 1.5; color: var(--muted); }
  .raceNote svg { flex: none; color: var(--red); margin-top: 1px; }
  #basePanel h5 { margin: 0 0 4px; font-size: 11px; font-weight: 700; color: var(--red-dark); text-transform: uppercase; letter-spacing: .06em; }
  /* ---------- Statewide totals ---------- */
  #totalsPanel { display: none; position: absolute; top: 16px; right: 80px; z-index: 1001; width: 360px; max-height: calc(100vh - 240px); overflow-y: auto; background: white; border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px 16px; }
  #totalsPanel.open { display: block; }
  #totalsPanel .tHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #totalsPanel h5 { margin: 0; font-size: 11px; font-weight: 700; color: var(--red-dark); text-transform: uppercase; letter-spacing: .06em; }
  #totalsPanel .tTitle { font-size: 16px; font-weight: 700; margin: 2px 0 6px; }
  #tClose { width: 32px; height: 32px; border: 0; border-radius: 8px; background: #f1f5f9; color: var(--ink-3); font-size: 18px; line-height: 1; flex: none; }
  .tState { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .tState h6 { margin: 0 0 8px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .tState h6 small { font-size: 11px; font-weight: 500; color: var(--muted); }
  .tNone { margin: 0; font-size: 13px; color: var(--muted); }
  .seats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .seat { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .seat.R { background: #fee2e2; color: #b91c1c; } .seat.D { background: #dbeafe; color: #1d4ed8; } .seat.O { background: #ede9fe; color: #6d28d9; }
  .tSub { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 4px; }
  .dists { max-height: 230px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
  .dist { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid #f1f5f9; }
  .dist:last-child { border-bottom: 0; }
  .dist b { font-weight: 600; color: var(--ink-3); }
  .dist .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dist .w i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .dist .mg { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tNote { margin: 12px 0 0; font-size: 11px; line-height: 1.45; color: var(--muted); }
  .lgLink { margin-top: 8px; padding: 0; border: 0; background: none; color: var(--red-dark); font-size: 11px; font-weight: 700; }
  .baseOpt { height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: white; color: var(--ink-3); font-size: 13px; text-align: left; }
  .baseOpt.on { border: 2px solid var(--red); background: var(--red-soft); color: #7f1d1d; font-weight: 700; }

  /* ---------- Legends ---------- */
  #legends { position: absolute; right: 16px; bottom: 112px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .legend { display: none; background: white; border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 11px; color: #475569; width: 220px; }
  .legend.show { display: block; }
  .legend b { display: block; font-size: 12px; color: var(--text); margin-bottom: 6px; }
  .ramp { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
  .ramp div { flex: 1; }
  .ramp-labels { display: flex; justify-content: space-between; margin-top: 4px; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* ---------- Hover card ---------- */
  #card { position: absolute; left: 14px; bottom: 30px; z-index: 1002; width: 300px; padding: 16px; background: white; border-radius: 16px; box-shadow: 0 14px 40px rgba(15,23,42,.28); opacity: 0; transition: opacity .12s; pointer-events: none; }
  #card.show { opacity: 1; }
  #card.follow { bottom: auto; }
  #card.phone { left: 50% !important; top: auto !important; bottom: 30px; transform: translateX(-50%); width: min(340px, calc(100vw - 28px)); }
  #card .where { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  #card .name { font-size: 16px; font-weight: 700; margin: 2px 0 10px; }
  #card .lead { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 12px; }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #f1f5f9; margin-bottom: 12px; }
  .bar div { height: 100%; }
  .cand { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }
  .cand .dot { width: 10px; height: 10px; border-radius: 3px; }
  .cand .pct { font-weight: 700; width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .cand .votes { color: var(--muted); font-variant-numeric: tabular-nums; }
  #card .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); }

  #status { position: absolute; bottom: 24px; left: 120px; z-index: 1000; font-size: 12px; padding: 5px 10px; border-radius: 8px; background: rgba(15,23,42,.8); color: #e2e8f0; font-variant-numeric: tabular-nums; }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.75) !important; }
  .leaflet-control-zoom { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 12px !important; overflow: hidden; }
  .leaflet-control-zoom a { width: 40px !important; height: 40px !important; line-height: 40px !important; background: var(--ink) !important; color: white !important; border-color: var(--ink-3) !important; }

  /* ---------- Phones (portrait) and short landscape screens ---------- */
  @media (max-width: 760px), (max-height: 500px) {
    #top { display: flex; top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right)); gap: 8px; z-index: 1002; }
    .brand { height: 48px; padding: 0 6px; border-radius: 12px; }
    .brand { display: none; }
    #ask { height: 48px; padding: 0 4px; gap: 4px; border-radius: 12px; }
    #ask .spark { display: none; }
    #askInput { height: 40px; font-size: 16px; padding-left: 4px; } /* 16px stops iPhone from zooming in on tap */
    #searchCol { flex: 1; }
    #ask { padding-left: 8px; }
    #ask .btn-red { height: 40px; padding: 0 14px; }

    /* Hamburger menu replaces the button column */
    #menuBtn { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--ink); color: white; box-shadow: var(--shadow); }
    #menuBtn .mClose, #menuBtn.open .mOpen { display: none; }
    #menuBtn.open .mClose { display: inline; }
    #menuBtn.open { background: var(--ink-2); }
    #rail { display: none; top: calc(66px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 230px; padding: 6px; gap: 4px; border-radius: 14px; z-index: 1002; }
    #rail.open { display: flex; }
    .rb { width: 100%; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
    .rb .tip, .rb:hover .tip { display: block; position: static; transform: none; padding: 0; background: none; color: #e2e8f0; font-size: 14px; font-weight: 600; }
    .rb.on .tip { color: white; }
    #rStates .tip { color: #e2e8f0; }
    #rStates:not(.on) .tip { color: #94a3b8; }

    /* Menus become bottom sheets */
    #basePanel, #racePanel, #totalsPanel {
      position: fixed; top: auto !important; left: 0; right: 0; bottom: 0; width: auto; max-width: none;
      max-height: calc(100vh - 70px); max-height: calc(100dvh - 70px); overflow-y: auto; overscroll-behavior: contain;
      border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(15,23,42,.3); z-index: 1003;
    }
    #basePanel, #racePanel { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); gap: 8px; }
    .raceOpt { padding: 10px 14px 10px 10px; }
    .raceOpt.on { padding: 9px 13px 9px 9px; }
    #totalsPanel { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
    .baseOpt { height: 46px; font-size: 14px; }

    /* Bottom of the map: legends left (above the scale), pinch to zoom instead of +/- */
    .leaflet-control-zoom { display: none; }
    #legends { left: calc(10px + env(safe-area-inset-left)); right: auto; bottom: calc(58px + env(safe-area-inset-bottom)); align-items: flex-start; }
    .leaflet-control-attribution { font-size: 9px; line-height: 1.35; }
    .legend { width: 200px; }
    .leaflet-bottom { margin-bottom: env(safe-area-inset-bottom); }
    #card.phone { bottom: calc(16px + env(safe-area-inset-bottom)); }
    #status { display: none; }
  }
  /* Landscape phones: keep menus from stretching edge to edge */
  @media (max-height: 500px) and (min-width: 761px) {
    #basePanel, #racePanel, #totalsPanel { width: min(600px, 100%); margin: 0 auto; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="brand">
    <div class="logo"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></div>
    <b>Election Precinct Results</b>
  </div>

  <div id="searchCol">
    <form id="ask" autocomplete="off">
      <svg class="spark" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/></svg>
      <label for="askInput" style="position:absolute;left:-9999px">Search or ask</label>
      <input id="askInput" placeholder="Ask: “2026 Mike Kennedy race”, “Trump over 80% in Wyoming”, “go to Moab” or a precinct code">
      <button type="submit" class="btn-red">Search</button>
    </form>

    <div id="result">
      <div class="txt"><div id="resultText"></div><div class="tags" id="resultTags"></div></div>
      <button class="btn-ghost" id="clearBtn" type="button">Clear</button>
    </div>
  </div>

  <button type="button" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="rail"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path class="mOpen" d="M4 7h16M4 12h16M4 17h16"/><path class="mClose" d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<div id="rail">
  <button class="rb" id="rBase" style="--c:#dc2626;color:#f87171" aria-label="Map options" aria-expanded="false"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></svg><span class="tip">Map options</span></button>
  <button class="rb" id="rElection" style="--c:#dc2626;color:#f87171" aria-label="Election results" aria-expanded="false"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span class="tip">Election results</span></button>
  <button class="rb" id="rTotals" style="--c:#dc2626;color:#f87171" aria-label="Statewide totals" aria-expanded="false"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V3h10v9M10.25 7.25l1.5 1.5 2.5-2.5M3 12h18v9H3zM9 16.5h6"/></svg><span class="tip">Statewide totals</span></button>
  <button class="rb on" id="rStates" style="--c:#475569;color:#cbd5e1" aria-label="State outlines" aria-pressed="true"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.5"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><span class="tip">State outlines</span></button>
</div>

<div id="basePanel">
  <h5>Map options</h5>
  <button class="baseOpt on" data-base="Topo">Topo</button>
  <button class="baseOpt" data-base="Satellite">Satellite</button>
  <button class="baseOpt" data-base="Streets">Streets</button>
</div>

<div id="racePanel" role="dialog" aria-label="Election results">
  <h5><span class="hIc"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>Election results</h5>
  <div class="raceGroup">2024</div>
  <button class="raceOpt" data-race="p2024"><span class="rIc"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg></span><span class="rTx">President<small>Utah + Wyoming</small></span></button>
  <div class="raceGroup">2026</div>

// ---------- Statewide totals ----------
const PC = { R: "var(--rep)", D: "var(--dem)", O: "#8b5cf6" };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function winner(x) {
  const ov = x.o ? x.o.v : Math.max(0, x.t - x.r - x.d), top = Math.max(x.r, x.d, ov);
  const lead = [x.r, x.d, ov].sort((a, b) => b - a), m = x.t ? (lead[0] - lead[1]) / x.t : 0;
  // Unopposed: one named candidate, and (Wyoming, where write-ins are lumped in) little else on the ballot line
  const u = [x.r, x.d, x.o ? x.o.v : 0].filter(v => v > 0).length === 1 && (x.o || ov < 0.1 * x.t);
  if (x.r === top && x.r > 0) return { p: "R", n: x.rn || "Republican", m, u };
  if (x.d === top && x.d > 0) return { p: "D", n: x.dn || "Democrat", m, u };
  return { p: "O", n: x.o ? `${x.o.n} (${x.o.p})` : "Write-in / other", m, u };
}
function voteRows(r, d, t, rn, dn) {
  const o = Math.max(0, t - r - d);
  const row = (c, n, v) => `<div class="cand"><span class="dot" style="background:${c}"></span><span>${esc(n)}</span><span class="votes">${fmt(v)}</span><span class="pct">${pct(v, t).toFixed(1)}%</span></div>`;
  return `<div class="bar"><div style="width:${pct(r, t)}%;background:var(--rep)"></div><div style="width:${pct(o, t)}%;background:var(--other)"></div><div style="width:${pct(d, t)}%;background:var(--dem)"></div></div>`
    + row("var(--rep)", rn, r) + row("var(--dem)", dn, d) + row("var(--other)", "Other", o);
}
function stateTotals(st, list, k) {
  const name = st === "UT" ? "Utah" : "Wyoming";
  if (!list || !list.length) return `<div class="tState"><h6>${name}</h6><p class="tNone">${esc((RACES[k].none || {})[st] || "No results.")}</p></div>`;
  let r = 0, d = 0, t = 0; list.forEach(x => { r += x.r; d += x.d; t += x.t; });
  if (list.length === 1) {
    const x = list[0], w = winner(x);
    return `<div class="tState"><h6>${name}<small>${x.dist === "Statewide" ? "" : esc(x.dist) + " · "}${fmt(t)} votes</small></h6>${voteRows(r, d, t, x.rn || "Republican", x.dn || "Democrat")}
      <div class="tSub">Winner</div><div style="font-size:13px;font-weight:600"><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:${PC[w.p]}"></span>${esc(w.n)} · +${(w.m * 100).toFixed(1)}</div></div>`;
  }
  const ws = list.map(x => ({ x, w: winner(x) }));
  const n = p => ws.filter(o => o.w.p === p).length;
  const seats = ["R", "D", "O"].filter(p => n(p)).map(p => `<span class="seat ${p}">${n(p)} ${p === "R" ? "Republican" : p === "D" ? "Democrat" : "Other"}</span>`).join("");
  const unopp = ws.filter(o => o.w.u).length;
  const what = k === "house" ? "districts" : "seats on the ballot";
  return `<div class="tState"><h6>${name}<small>${list.length} ${what} · ${fmt(t)} votes</small></h6>
    <div class="seats">${seats}</div>
    <div class="tSub">All votes cast</div>${voteRows(r, d, t, "Republicans", "Democrats")}
    ${unopp ? `<p class="tNote" style="margin-top:4px">${unopp} ran unopposed, which skews the vote totals.</p>` : ""}
    <div class="tSub">By district</div><div class="dists">${ws.map(({ x, w }) =>
      `<div class="dist"><b>${esc(x.dist)}</b><span class="w"><i style="background:${PC[w.p]}"></i>${esc(w.n)}</span><span class="mg" style="color:${PC[w.p]}">${w.u ? "Unopp." : "+" + (w.m * 100).toFixed(1)}</span></div>`).join("")}</div></div>`;
}
async function renderTotals() {
  if (!$("totalsPanel").classList.contains("open")) return;
  const k = race, R = RACES[k], body = $("tBody");
  let html = `<div class="tTitle">${esc(R.title.replace(/^./, c => c.toUpperCase()))}</div>`;
  if (k === "p2024") {
    const raw = await getRaw(R.file), sum = { UT: [0, 0, 0], WY: [0, 0, 0] };
    raw.features.forEach(f => { const p = f.properties, s = sum[p.s]; if (s) { s[0] += p.r; s[1] += p.d; s[2] += p.t; } });
    html += ["UT", "WY"].map(st => `<div class="tState"><h6>${st === "UT" ? "Utah" : "Wyoming"}<small>${fmt(sum[st][2])} votes</small></h6>${voteRows(sum[st][0], sum[st][1], sum[st][2], R.r, R.d)}</div>`).join("");
    html += `<p class="tNote">Sum of the precinct results on the map (The New York Times).</p>`;
  } else {
    const sw = await getRaw(SW);
    html += stateTotals("UT", sw.UT.totals[k], k) + stateTotals("WY", sw.WY.totals[k], k);
    html += `<p class="tNote">Wyoming: official state canvass. Utah: counties have canvassed; the statewide canvass hasn't certified yet. Margins are winner over runner-up.${k === "ssen" ? " Only about half of each state's senate seats were on the ballot." : ""}</p>`;
  }
  if (race === k) body.innerHTML = html;
}
function openTotals(open) {
  $("totalsPanel").classList.toggle("open", open); $("rTotals").classList.toggle("on", open); $("rTotals").setAttribute("aria-expanded", open);
  if (open) { openRacePanel(false); $("basePanel").classList.remove("open"); $("rBase").setAttribute("aria-expanded", "false"); renderTotals(); }
}
$("rTotals").onclick = () => openTotals(!$("totalsPanel").classList.contains("open"));
$("lgTotals").onclick = () => openTotals(true);
$("tClose").onclick = () => openTotals(false);
$("rBase").addEventListener("click", () => openTotals(false));
$("rElection").addEventListener("click", () => openTotals(false));

// ---------- Counties (for the search box) ----------
const COUNTIES = {
  UT: "Beaver,Box Elder,Cache,Carbon,Daggett,Davis,Duchesne,Emery,Garfield,Grand,Iron,Juab,Kane,Millard,Morgan,Piute,Rich,Salt Lake,San Juan,Sanpete,Sevier,Summit,Tooele,Uintah,Utah,Wasatch,Washington,Wayne,Weber".split(","),
  WY: "Albany,Big Horn,Campbell,Carbon,Converse,Crook,Fremont,Goshen,Hot Springs,Johnson,Laramie,Lincoln,Natrona,Niobrara,Park,Platte,Sheridan,Sublette,Sweetwater,Teton,Uinta,Washakie,Weston".split(",")
};

// ---------- Search box: switching races ("show me the 2026 Mike Kennedy race") ----------
const norm = t => " " + t.toLowerCase().replace(/[“”"'.,]/g, "").replace(/\s+/g, " ") + " ";
let candIndex = null;
async function candidates() {
  if (candIndex) return candIndex;
  const sw = await getRaw(SW), list = [];
  for (const k of ["house", "sen", "gov", "sth", "ssen"]) for (const st of ["UT", "WY"]) for (const x of (sw[st].totals[k] || []))
    for (const [n, side] of [[x.rn, "R"], [x.dn, "D"], [x.o && x.o.n, "O"]])
      if (n && !/write-in/i.test(n)) list.push({ name: n, key: norm(n).trim(), last: norm(n).trim().split(" ").pop(), k, st, dist: x.dist, side, rn: x.rn, dn: x.dn });
  return candIndex = list;
}
// Figures out which race a search is about. Returns null if it doesn't mention one.
async function raceIntent(raw) {
  let q = norm(raw), k = null, cand = null, dist = null;
  const take = re => { const m = q.match(re); if (m) q = q.replace(re, " "); return m; };
  // A candidate by full name, or by a last name only one 2026 candidate has
  try {
    const list = await candidates();
    cand = list.find(c => q.includes(" " + c.key + " "));
    if (!cand) { const ms = list.filter(c => c.last.length > 3 && q.includes(" " + c.last + " ")); if (ms.length && ms.every(c => c.k === ms[0].k && c.dist === ms[0].dist)) cand = ms[0]; }
    if (cand) { q = q.replace(" " + cand.key + " ", " ").replace(" " + cand.last + " ", " "); k = cand.k; }
  } catch {}
  if (!k) {
    if (take(/ state senate | (?:sd|senate district) ?(\d+) /)) k = "ssen";
    else if (take(/ state house | (?:hd|house district) ?(\d+) | legislature | legislative /)) k = "sth";
    else if (take(/ governors? | gubernatorial /)) k = "gov";
    else if (take(/ (?:us |u s )?senate | senators? /)) k = "sen";
    else if (take(/ (?:us |u s )?house | congress(?:ional)? | congressman | congresswoman /)) k = "house";
    else if (take(/ president(?:ial)? /) || / (trump|harris) /.test(q)) k = "p2024";
    else if (/ 2024 /.test(q)) k = "p2024";
    else if (/ 2026 /.test(q)) k = "house";
  }
  if (!k) return null;
  const d = norm(raw).match(/ (?:hd|house district) ?(\d+) /), sd = norm(raw).match(/ (?:sd|senate district) ?(\d+) /), cd = norm(raw).match(/ (ut|utah|wy)[- ]?(\d|al) /);
  if (!cand && k === "sth" && d) dist = "HD " + d[1];
  if (!cand && k === "ssen" && sd) dist = "SD " + sd[1];
  if (!cand && k === "house" && cd) dist = (cd[1] === "wy" ? "WY-" : "UT-") + cd[2].toUpperCase();
  const STOP = / (?:show|me|the|a|an|race|races|results?|map|of|for|in|on|view|see|look|at|switch|to|please|2024|2026|election|elections|whats|what|is) /;
  while (STOP.test(q)) q = q.replace(STOP, " ");
  return { k, cand, dist, rest: q.trim() };
}
async function runRaceSearch(ri, raw) {
  filterFn = null; lastQuery = null;
  if (ri.k !== race || !map.hasLayer(precincts)) await setRace(ri.k);
  await loadPrecincts();
  const tests = [], tags = [RACES[ri.k].title];
  const inDist = dd => p => dd === "Statewide" ? p.s === ri.cand.st : (p.dist || "").split(/,\s*/).includes(dd);
  if (ri.cand) { tests.push(inDist(ri.cand.dist)); tags.push(`${ri.cand.name}${ri.cand.dist === "Statewide" ? "" : " · " + ri.cand.dist}`); }
  else if (ri.dist) { tests.push(p => (p.dist || "").split(/,\s*/).includes(ri.dist)); tags.push(ri.dist); }
  if (ri.rest) { const pq = parseQuery(ri.rest); if (pq.tests) { tests.push(...pq.tests); tags.push(...pq.tags); } }
  const lbl = ri.cand && ri.cand.rn && ri.cand.dn ? { r: short(ri.cand.rn), d: short(ri.cand.dn) } : null;
  if (tests.length) return applyTests(tests, tags, `“${raw}”`, lbl);
  precincts.setStyle(precinctStyle);
  showResult(`Showing <b>${RACES[ri.k].title}</b>`, []);
}

// ---------- Search box (plain-English) ----------
const num = s => parseFloat(String(s).replace(/,/g, ""));
function parseQuery(raw) {
  const q = " " + raw.toLowerCase().replace(/[“”"]/g, "") + " ";
  const tests = [], tags = [];
  const add = (fn, tag) => { tests.push(fn); tags.push(tag); };
  const go = q.match(/\b(?:go to|goto|take me to|zoom to|fly to|show me|near|find)\s+(.+?)\s*$/);
  if (go && !/precinct|trump|harris|county|won|vote|%|competitive|close|over|under/.test(go[1])) return { place: go[1].trim() };
  const saysWY = /\b(wyoming|wy)\b/.test(q);
  const saysUT = /\b(utah|ut)\b(?!\s+(county|co\b))/.test(q);
  const state = saysWY && !saysUT ? "WY" : saysUT && !saysWY ? "UT" : null;
  if (state) add(p => p.s === state, state === "UT" ? "Utah" : "Wyoming");
  const ct = [], ctag = [];
  for (const [st, list] of Object.entries(COUNTIES)) for (const c of list) {
    const m = q.match(new RegExp("\\b" + c.toLowerCase() + "(\\s+county|\\s+co\\b)?\\b"));
    if (!m || (c === "Utah" && !m[1]) || (state && state !== st)) continue;
    ct.push(p => p.c === c && p.s === st); ctag.push(`${c} County${c === "Carbon" && !state ? ` (${st})` : ""}`);
  }
  if (ct.length) add(p => ct.some(t => t(p)), ctag.join(" or "));
  const names = side => [...new Set((precinctData && race !== "p2024" ? precinctData.features : []).map(f => f.properties[side]).filter(Boolean).map(n => short(n).toLowerCase()))].join("|");
  const RW = ["trump|republicans?|gop|red|against", RACES[race].r.toLowerCase(), names("rn")].filter(Boolean).join("|");
  const DW = ["harris|democrats?|democratic|dems?|blue|for", RACES[race].d.toLowerCase(), names("dn")].filter(Boolean).join("|");
  const RL = LBL.r, DL = LBL.d;
  if (new RegExp(`\\b(${RW})\\s+(won|wins|win|carried|passed|precincts?)\\b`).test(q)) add(p => p.m < 0, `${RL} won`);
  if (new RegExp(`\\b(${DW})\\s+(won|wins|win|carried|passed|precincts?)\\b`).test(q)) add(p => p.m > 0, `${DL} won`);
  const share = new RegExp(`\\b(${RW}|${DW})\\s+(?:is\\s+|got\\s+|with\\s+)?(over|above|more than|greater than|at least|>=|>|under|below|less than|at most|<=|<)\\s*(\\d+(?:\\.\\d+)?)\\s*(?:%|percent)?`, "g");
  let s;
  while ((s = share.exec(q))) {
    const who = s[1], v = num(s[3]) / 100, key = new RegExp(`^(${RW})$`).test(who) ? "r" : "d", up = /over|above|more|greater|least|>/.test(s[2]);
    add(p => { const x = p[key] / p.t; return up ? x >= v : x <= v; }, `${key === "r" ? RL : DL} ${up ? "≥" : "≤"} ${s[3]}%`);
  }
  const mg = q.match(/\b(?:margin\s+(?:under|below|less than|within)|within)\s*(\d+(?:\.\d+)?)\s*(?:%|points?|pts)?/);
  if (mg) { const v = num(mg[1]) / 100; add(p => Math.abs(p.m) <= v, `Margin ≤ ${mg[1]} pts`); }
  else if (/\b(competitive|close|swing|tossup|toss-up|purple)\b/.test(q)) add(p => Math.abs(p.m) <= 0.1, "Within 10 pts");
  const vt = q.match(/\b(over|above|more than|at least|under|below|less than|fewer than)\s*([\d,]+)\s*(?:total\s+)?votes?\b/);
  if (vt) { const v = num(vt[2]), up = /over|above|more|least/.test(vt[1]); add(p => up ? p.t >= v : p.t <= v, `${up ? "≥" : "≤"} ${fmt(v)} votes`); }
  else if (/\b(rural|remote|sparse|small)\b/.test(q)) add(p => p.t < 500, "Under 500 votes");
  if (/\bestimated\b/.test(q)) add(p => !p.o, "Estimated boundary");
  if (!tests.length) return { place: raw.replace(/^(go to|show me|zoom to|find)\s+/i, "").trim() };
  return { tests, tags };
}

async function applyTests(tests, tags, label, lbl) {
  if (!tests.length) { clearFilter(); return; }
  lastQuery = [tests, tags, label, lbl];
  const N = lbl || LBL;
  if (!map.hasLayer(precincts)) setLayer("rElection", true);
  await loadPrecincts();
  filterFn = p => tests.every(t => t(p));
  precincts.setStyle(precinctStyle);
  const hits = precinctData.features.filter(f => filterFn(f.properties));
  if (!hits.length) return showResult(`No precincts match ${label}.`, tags);
  let r = 0, d = 0, t = 0;
  hits.forEach(f => { r += f.properties.r; d += f.properties.d; t += f.properties.t; });
  showResult(`<b>${fmt(hits.length)}</b> precincts · ${fmt(t)} votes · ${N.r} ${pct(r, t).toFixed(1)}% · ${N.d} ${pct(d, t).toFixed(1)}%`, tags);
  map.fitBounds(L.geoJSON({ type: "FeatureCollection", features: hits }).getBounds(), { padding: [60, 60], maxZoom: 12 });
}

async function goToPlace(place) {
  showResult(`Looking up “${place}”…`, []);
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&viewbox=-114.1,45.1,-104,36.9&bounded=1&q=" + encodeURIComponent(place);
    const res = await (await fetch(url)).json();
    if (!res.length) return showResult(`Couldn't find “${place}” in Utah or Wyoming.`, []);
    const b = res[0].boundingbox.map(Number);
    map.fitBounds([[b[0], b[2]], [b[1], b[3]]], { maxZoom: 13 });
    showResult(`📍 ${res[0].display_name.split(",").slice(0, 3).join(",")}`, []);
  } catch { showResult("Place search isn't available right now.", []); }
}
async function findPrecinct(code) {
  if (!map.hasLayer(precincts)) setLayer("rElection", true);
  await loadPrecincts();
  const c = code.toLowerCase().replace(/^0+/, "");
  const hit = precinctData.features.find(f => f.properties.n.toLowerCase() === code.toLowerCase())
    || precinctData.features.find(f => f.properties.n.toLowerCase().replace(/(^|-)0+(?=\d)/g, "$1").split(" ")[0] === c.replace(/(^|-)0+(?=\d)/g, "$1"));
  if (!hit) return showResult(`No precinct “${code}” in ${RACES[race].title}.`, []);
  const lyr = precincts.getLayers().find(l => l.feature === hit);
  map.fitBounds(lyr.getBounds(), { maxZoom: 14, padding: [80, 80] });
  lyr.setStyle({ weight: 3, color: "#0f172a", opacity: 1 }); lyr.bringToFront();
  showCard(hit.properties, false); card.classList.add("phone"); card.classList.remove("follow");
  showResult(`Precinct <b>${hit.properties.n}</b> · ${hit.properties.c} County`, []);
}
function showResult(html, tags) {
  $("resultText").innerHTML = html;
  $("resultTags").innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join("");
  $("result").classList.add("show");
}
function clearFilter() {
  filterFn = null; lastQuery = null; precincts.setStyle(precinctStyle);
  $("result").classList.remove("show"); $("askInput").value = "";
}
$("ask").onsubmit = async e => {
  e.preventDefault();
  const raw = $("askInput").value; if (!raw.trim()) return;
  const code = raw.trim().match(/^(?:precinct\s+)?([a-z]{0,3}\d[\w-]*)$/i);
  const ri = await raceIntent(raw);
  if (ri) return runRaceSearch(ri, raw);
  if (code) return findPrecinct(code[1]);
  const parsed = parseQuery(raw);
  parsed.place ? goToPlace(parsed.place) : applyTests(parsed.tests, parsed.tags, `“${raw}”`);
};
$("clearBtn").onclick = () => clearFilter();

// Phone hamburger menu
function openMenu(open) { $("rail").classList.toggle("open", open); $("menuBtn").classList.toggle("open", open); $("menuBtn").setAttribute("aria-expanded", open); }
$("menuBtn").onclick = () => openMenu(!$("rail").classList.contains("open"));
document.querySelectorAll("#rail .rb").forEach(b => b.addEventListener("click", () => openMenu(false)));
// Close menus when clicking the map
map.on("click", () => { openMenu(false); $("basePanel").classList.remove("open"); $("rBase").setAttribute("aria-expanded", "false"); openRacePanel(false); if (phoneMQ.matches) openTotals(false); });
// Shorter search hint on small screens
const phoneMQ = matchMedia("(max-width: 760px), (max-height: 500px)");
const longHint = $("askInput").placeholder;
const syncHint = () => { $("askInput").placeholder = phoneMQ.matches ? "Search a race or place…" : longHint; };
phoneMQ.addEventListener("change", syncHint); syncHint();
setLayer("rElection", true); // show results when the page opens
map.on("mousemove", e => setStatus(`${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`));
// Pinch zooms the map only, never the whole page (iPhone Safari ignores user-scalable=no)
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
</script>
