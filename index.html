<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land Finder — Utah & Wyoming</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- Open connections to the map servers early so the first tiles arrive faster -->
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://services.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://gis.blm.gov" crossorigin>
<link rel="preconnect" href="https://basemap.nationalmap.gov" crossorigin>
<link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .title {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: rgba(255,255,255,.92); padding: 8px 12px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); font-weight: 600;
  }
  .title small { display: block; font-weight: 400; color: #555; }
  .legend {
    background: rgba(255,255,255,.92); padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 12px; line-height: 18px;
  }
  .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; opacity: .8; }
  #coords {
    position: absolute; bottom: 24px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,.92); padding: 4px 8px; border-radius: 6px; font-size: 12px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="title">Land Finder<small>Utah &amp; Wyoming</small></div>
<div id="coords">Move the mouse over the map</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- Speed settings shared by every layer ----------
// updateWhenZooming:false -> don't fetch tiles for the in-between zoom levels, only where you land
// keepBuffer:6            -> keep more already-loaded tiles around the edges so panning back is instant
const fast = { updateWhenZooming: false, keepBuffer: 6 };

// ---------- Base maps ----------
const baseMaps = {
  "Topo": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
    ...fast, maxZoom: 19, attribution: "Topo &copy; Esri, USGS"
  }),
  "Satellite": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    ...fast, maxZoom: 19, attribution: "Imagery &copy; Esri"
  }),
  "Streets": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    ...fast, maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }),
  "USGS Topo (detailed, slower)": L.tileLayer("https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}", {
    ...fast, maxNativeZoom: 16, maxZoom: 19, attribution: "USGS The National Map"
  })
};

const map = L.map("map", { layers: [baseMaps["Topo"]], preferCanvas: true });

// ---------- State outlines ----------
// Utah and Wyoming share the same corner points, so their common border is drawn once.
const UT_WY_X = -111.0467;   // north–south line where Utah's NE notch meets Wyoming
const states = {
  type: "FeatureCollection",
  features: [
    { type: "Feature", properties: { name: "Utah" }, geometry: { type: "Polygon", coordinates: [[
      [-114.0506, 37.0000], [-109.0452, 37.0000], [-109.0501, 41.0000], [UT_WY_X, 41.0000],
      [UT_WY_X, 42.0016], [-114.0396, 42.0016], [-114.0506, 37.0000]
    ]]}},
    { type: "Feature", properties: { name: "Wyoming" }, geometry: { type: "Polygon", coordinates: [[
      [UT_WY_X, 41.0000], [-109.0501, 41.0000], [-104.0530, 41.0016], [-104.0579, 44.9976],
      [-111.0562, 44.9988], [-111.0446, 42.0016], [UT_WY_X, 42.0016], [UT_WY_X, 41.0000]
    ]]}}
  ]
};
const stateLayer = L.geoJSON(states, {
  style: { color: "#d62828", weight: 2.5, opacity: 0.8, fill: false },
  onEachFeature: (f, layer) => layer.bindTooltip(f.properties.name, { sticky: true })
}).addTo(map);
map.fitBounds(stateLayer.getBounds(), { padding: [20, 20] });

// ---------- Overlays ----------
const landOwnership = L.tileLayer(
  "https://gis.blm.gov/arcgis/rest/services/lands/BLM_Natl_SMA_Cached_without_PriUnk/MapServer/tile/{z}/{y}/{x}",
  { ...fast, maxZoom: 19, opacity: 0.55, attribution: "BLM Surface Management Agency" }
);

const overlays = {
  "State outlines": stateLayer,
  "Land ownership (public land)": landOwnership
};
L.control.layers(baseMaps, overlays, { collapsed: false }).addTo(map);
L.control.scale({ imperial: true, metric: false }).addTo(map);

// ---------- Legend for land ownership ----------
const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `<b>Land ownership</b><br>
    <i style="background:#fee67a"></i>BLM<br>
    <i style="background:#cde3a6"></i>Forest Service<br>
    <i style="background:#cab3d6"></i>National Park<br>
    <i style="background:#9dc8e4"></i>State<br>
    <i style="background:#fbb4c9"></i>Tribal (BIA)<br>
    <i style="background:#fff;border:1px solid #ccc"></i>Blank = mostly private`;
  return div;
};
map.on("overlayadd", e => { if (e.layer === landOwnership) legend.addTo(map); });
map.on("overlayremove", e => { if (e.layer === landOwnership) legend.remove(); });

// ---------- Coordinates readout ----------
const coords = document.getElementById("coords");
map.on("mousemove", e => {
  coords.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
});
</script>
</body>
</html>
